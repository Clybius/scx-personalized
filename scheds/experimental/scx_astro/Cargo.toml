[package]
name = "scx_astro"
version = "0.1.0"
authors = ["scx_astro contributors"]
edition = "2021"
description = "Hybrid classification multi-lane sched_ext scheduler with SRPT prioritization and waker-boost chains. https://github.com/sched-ext/scx/tree/main"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
clap_complete = "4"
crossbeam = "0.8"
libbpf-rs = "=0.26.2"
log = "0.4"
scx_stats = { path = "../../../rust/scx_stats", version = "1.1.0" }
scx_stats_derive = { path = "../../../rust/scx_stats/scx_stats_derive", version = "1.1.0" }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.0" }
serde = { version = "1", features = ["derive"] }
simplelog = "0.12"
nix = { version = "0.29", features = ["process"] }

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.0" }

[features]
enable_backtrace = []
