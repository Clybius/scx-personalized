[package]
name = "scx_happy"
version = "1.0.0"
edition = "2021"
license = "GPL-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
ctrlc = "3.4"
env_logger = "0.11"
libbpf-rs = "=0.26.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
scx_stats = { path = "../../../rust/scx_stats" }
scx_utils = { path = "../../../rust/scx_utils" }

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo" }
